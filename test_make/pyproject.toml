[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fossdev-quality-demo"
version = "0.1.0"
authors = [
    { name = "Ваше Имя", email = "your.email@example.com" }
]
description = "Демонстрационный проект с автоматизацией через Makefile: проверка типов, стилей и зависимостей"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "requests>=2.31.0",
    "pydantic>=2.6.0",
]

[project.urls]
Homepage = "https://github.com/ваш-логин/fossdev-quality-demo"
Repository = "https://github.com/ваш-логин/fossdev-quality-demo"
Issues = "https://github.com/ваш-логин/fossdev-quality-demo/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]